services:
  # 01. Spring Boot Backend Web Service
  - type: web
    name: airwise-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: airwise-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: airwise-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: airwise-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /actuator/health

  # 02. React Frontend Static Site (Served globally via Render CDN)
  - type: web
    name: airwise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://airwise-backend.onrender.com

databases:
  # 03. Managed PostgreSQL Database
  - name: airwise-db
    plan: free
    region: oregon
    databaseName: airwisedb
    user: airwise
