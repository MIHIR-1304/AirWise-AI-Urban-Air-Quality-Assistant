<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Atmospheric Aurora Gradient -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#C5F36B" />
    </linearGradient>

    <!-- Deep Cybernetic Obsidian Gradient -->
    <linearGradient id="cyberDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Lime Spark Gradient -->
    <linearGradient id="limeSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2FFA8" />
      <stop offset="100%" stop-color="#C5F36B" />
    </linearGradient>

    <!-- Soft Atmospheric Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Badge (Sleek Rounded Squircle) -->
  <rect width="100" height="100" rx="28" fill="url(#cyberDark)" />
  
  <!-- Subtle Outer Atmospheric Orbital Rings -->
  <circle cx="50" cy="50" r="41" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="45" stroke="url(#auroraGlow)" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Dynamic Aerodynamic Wind Vortex & "A" Wing Loop -->
  <g filter="url(#softGlow)">
    <!-- Primary Left Flow: Upward Sweeping Aerodynamic Wing -->
    <path d="M 23 75 
             C 21 68, 25 54, 34 40 
             C 41 29, 45 22, 50 18 
             C 53 21, 57 28, 62 36 
             C 65 41, 67 47, 65 52 
             C 63 56, 58 57, 53 54 
             C 47 50, 46 43, 50 37 
             C 45 42, 40 50, 36 60 
             C 32 70, 26 77, 23 75 Z"
          fill="url(#auroraGlow)" />

    <!-- Secondary Right Flow: Complementary Möbius Loop & Ozone Ribbon -->
    <path d="M 50 18 
             C 55 22, 62 33, 68 45 
             C 74 57, 78 68, 75 74 
             C 72 79, 64 78, 59 72 
             C 53 66, 53 58, 58 53 
             C 62 49, 67 52, 68 56 
             C 66 52, 62 47, 58 43 
             C 53 38, 48 30, 50 18 Z"
          fill="url(#auroraGlow)"
          opacity="0.85" />

    <!-- Central Connecting Aerodynamic Bridge (Crossbar of "A") -->
    <path d="M 33 55 
             C 40 52, 46 51, 54 53 
             C 60 54, 64 57, 67 58
             C 64 61, 58 60, 52 58
             C 44 56, 38 57, 33 55 Z" 
          fill="#C5F36B" />
  </g>

  <!-- Glowing Central AI Intelligence Core / Clean Air Spark -->
  <g filter="url(#coreGlow)">
    <!-- 4-Point Diamond Intelligence Spark -->
    <path d="M 50 39 
             Q 50 47, 58 47 
             Q 50 47, 50 55 
             Q 50 47, 42 47 
             Q 50 47, 50 39 Z" 
          fill="url(#limeSpark)" />
    
    <!-- Central Pure Photon Core Dot -->
    <circle cx="50" cy="47" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Ambient Micro Atmospheric Particles (Planetary Sensor Telemetry) -->
  <circle cx="28" cy="30" r="1.5" fill="#00F2FE" opacity="0.75" />
  <circle cx="72" cy="28" r="1.2" fill="#C5F36B" opacity="0.8" />
  <circle cx="78" cy="62" r="1.5" fill="#10B981" opacity="0.7" />
  <circle cx="24" cy="58" r="1" fill="#C5F36B" opacity="0.6" />
</svg>
