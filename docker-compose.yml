services:
  postgres:
    image: postgres:16-alpine
    container_name: airwise-postgres
    restart: always
    environment:
      POSTGRES_DB: airwisedb
      POSTGRES_USER: airwise
      POSTGRES_PASSWORD: airwise_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airwise -d airwisedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airwise_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airwise-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airwisedb
      SPRING_DATASOURCE_USERNAME: airwise
      SPRING_DATASOURCE_PASSWORD: airwise_secret
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - airwise_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwise-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - airwise_net

volumes:
  postgres_data:
    driver: local

networks:
  airwise_net:
    driver: bridge
